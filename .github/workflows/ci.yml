name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test
  DB_USERNAME: postgres
  DB_PASSWORD: postgres
  DB_HOSTNAME: localhost

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dodo_router_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # Must match build-release.yml. CI testing an older Elixir than the one
      # that builds the release does not make CI stricter — it makes it wrong:
      # `attesto_mcp` and the `attesto` libraries under it call the `JSON`
      # module, which only exists from Elixir 1.18, so every MCP test failed
      # here with `function JSON.encode!/1 is undefined` while passing
      # everywhere the release is actually built.
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4.14"

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Setup database
        run: mix ecto.setup

      - name: Run tests
        run: mix test
