name: Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., 0.1.1)'
        required: true
        type: string
      full_install:
        description: 'Force full install (stop, replace, restart) instead of hot upgrade. Required when the release was built with a different OTP/ERTS than the running node.'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: production
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION=${{ github.event.release.tag_name }}
            VERSION=${VERSION#v}
          else
            VERSION=${{ inputs.version }}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: $VERSION"

      - name: Setup Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Determine deploy path
        id: deploy_path
        run: |
          TARGET_VERSION="${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"

          if [ "${{ inputs.full_install }}" = "true" ]; then
            echo "Full install forced via workflow input"
            echo "deploy_versions=$TARGET_VERSION" >> $GITHUB_OUTPUT
            echo "full_install=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get currently running version from server
          CURRENT_VERSION=$(ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            ${{ secrets.APP_DEPLOY_USER }}@${{ secrets.APP_DEPLOY_HOST }} \
            "~/dodorouter/current/dodo_router/bin/dodo_router version 2>/dev/null | awk '{print \$2}'" || echo "unknown")
          
          echo "Current running version: $CURRENT_VERSION"
          echo "Target version: $TARGET_VERSION"
          
          if [ "$CURRENT_VERSION" = "unknown" ]; then
            echo "No current version detected - will do full install"
            echo "deploy_versions=$TARGET_VERSION" >> $GITHUB_OUTPUT
            echo "full_install=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Extract patch numbers
          CURRENT_PATCH=$(echo "$CURRENT_VERSION" | awk -F. '{print $3}')
          TARGET_PATCH=$(echo "$TARGET_VERSION" | awk -F. '{print $3}')
          
          if [ "$TARGET_PATCH" -le "$CURRENT_PATCH" ]; then
            echo "ERROR: Target version $TARGET_VERSION is not newer than current $CURRENT_VERSION"
            exit 1
          fi
          
          # Build list of versions to deploy sequentially
          VERSIONS_TO_DEPLOY=""
          ALL_RELEASES_EXIST=true
          
          for ((patch=CURRENT_PATCH+1; patch<=TARGET_PATCH; patch++)); do
            MAJOR_MINOR=$(echo "$CURRENT_VERSION" | awk -F. '{print $1 "." $2}')
            VERSION="${MAJOR_MINOR}.${patch}"
            
            if [ -z "$VERSIONS_TO_DEPLOY" ]; then
              VERSIONS_TO_DEPLOY="$VERSION"
            else
              VERSIONS_TO_DEPLOY="${VERSIONS_TO_DEPLOY},${VERSION}"
            fi
            
            # Check if release exists on GitHub
            if ! gh release view "v${VERSION}" --repo "$REPO" > /dev/null 2>&1; then
              echo "WARNING: Release v${VERSION} does not exist on GitHub"
              ALL_RELEASES_EXIST=false
            fi
          done
          
          echo "Versions to deploy: $VERSIONS_TO_DEPLOY"
          echo "All releases exist: $ALL_RELEASES_EXIST"
          
          if [ "$ALL_RELEASES_EXIST" = "true" ]; then
            echo "deploy_versions=$VERSIONS_TO_DEPLOY" >> $GITHUB_OUTPUT
            echo "full_install=false" >> $GITHUB_OUTPUT
          else
            echo "WARNING: Missing intermediate releases - will do full restart to $TARGET_VERSION"
            echo "deploy_versions=$TARGET_VERSION" >> $GITHUB_OUTPUT
            echo "full_install=true" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download releases
        run: |
          IFS=',' read -ra VERSIONS <<< "${{ steps.deploy_path.outputs.deploy_versions }}"
          
          mkdir -p /tmp/release
          cd /tmp/release
          
          for VERSION in "${VERSIONS[@]}"; do
            echo "Downloading v${VERSION}..."
            gh release download "v${VERSION}" \
              --repo "${{ github.repository }}" \
              --pattern "dodo_router-${VERSION}.tar.gz" || {
              echo "ERROR: Failed to download v${VERSION}"
              exit 1
            }
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check pending migrations
        run: |
          echo "Checking pending migrations..."
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            ${{ secrets.APP_DEPLOY_USER }}@${{ secrets.APP_DEPLOY_HOST }} \
            "~/dodorouter/current/dodo_router/bin/dodo_router eval 'Ecto.Migrator.with_repo(DodoRouter.Repo, fn repo -> IO.inspect(Ecto.Migrator.migrations(repo)) end)'" || {
            echo "WARNING: Could not check pending migrations"
          }

      - name: Deploy to server
        run: |
          IFS=',' read -ra VERSIONS <<< "${{ steps.deploy_path.outputs.deploy_versions }}"
          FULL_INSTALL="${{ steps.deploy_path.outputs.full_install }}"
          
          if [ "$FULL_INSTALL" = "true" ]; then
            VERSION="${VERSIONS[-1]}"
            echo "Performing full install of v${VERSION}..."
            scp -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
              /tmp/release/dodo_router-${VERSION}.tar.gz \
              ${{ secrets.APP_DEPLOY_USER }}@${{ secrets.APP_DEPLOY_HOST }}:/tmp/dodo_router-${VERSION}.tar.gz

            # Run the new release's migrations BEFORE stopping the old one:
            # just the migration .exs files from the tarball, executed through
            # the still-running release, so a failure leaves it serving. The
            # in-place migrate below then re-runs as a no-op.
            echo "Running v${VERSION} migrations before install..."
            MIGRATIONS_DIR="/tmp/dodo_migrations/dodo_router/lib/dodo_router-${VERSION}/priv/repo/migrations"
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
              ${{ secrets.APP_DEPLOY_USER }}@${{ secrets.APP_DEPLOY_HOST }} \
              "rm -rf /tmp/dodo_migrations && mkdir -p /tmp/dodo_migrations && tar xzf /tmp/dodo_router-${VERSION}.tar.gz -C /tmp/dodo_migrations dodo_router/lib/dodo_router-${VERSION}/priv/repo/migrations && ~/dodorouter/current/dodo_router/bin/dodo_router eval 'Ecto.Migrator.with_repo(DodoRouter.Repo, fn repo -> Ecto.Migrator.run(repo, ~s(${MIGRATIONS_DIR}), :up, all: true) end)' && rm -rf /tmp/dodo_migrations" || {
              echo "ERROR: Database migration failed — aborting before install (old version untouched)"
              exit 1
            }

            # Stop current version, extract new version
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
              ${{ secrets.APP_DEPLOY_USER }}@${{ secrets.APP_DEPLOY_HOST }} \
              "systemctl --user stop dodo-router && rm -rf ~/dodorouter/current/* && cd ~/dodorouter/current && tar xzf /tmp/dodo_router-${VERSION}.tar.gz"
            
            # Castle generates sys.config from runtime.exs on `start`, so a
            # freshly extracted release has none yet and `eval` cannot boot.
            # Generate it explicitly (booting off build.config, with the
            # service env loaded) before running migrations.
            echo "Generating sys.config for fresh install..."
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
              ${{ secrets.APP_DEPLOY_USER }}@${{ secrets.APP_DEPLOY_HOST }} \
              "set -a; . ~/dodorouter/.env; set +a; RELEASE_SYS_CONFIG=\$HOME/dodorouter/current/dodo_router/releases/${VERSION}/build ~/dodorouter/current/dodo_router/bin/dodo_router eval 'Castle.generate(~s(${VERSION}))'" || {
              echo "ERROR: sys.config generation failed"
              exit 1
            }

            # Run migrations using the NEW release before starting
            echo "Running database migrations with new release..."
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
              ${{ secrets.APP_DEPLOY_USER }}@${{ secrets.APP_DEPLOY_HOST }} \
              "~/dodorouter/current/dodo_router/bin/dodo_router eval DodoRouter.Release.migrate" || {
              echo "ERROR: Database migration failed"
              exit 1
            }
            
            # Sync static assets to Caddy
            echo "Syncing static assets to Caddy..."
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
              ${{ secrets.APP_DEPLOY_USER }}@${{ secrets.APP_DEPLOY_HOST }} \
              "rsync -a ~/dodorouter/current/dodo_router/lib/dodo_router-${VERSION}/priv/static/ ~/lobsterfarm-backend/web_files/dodorouter-static/"
            
            # Start the new version
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
              ${{ secrets.APP_DEPLOY_USER }}@${{ secrets.APP_DEPLOY_HOST }} \
              "systemctl --user start dodo-router"
          else
            # Sequential hot upgrades
            for VERSION in "${VERSIONS[@]}"; do
              echo "Deploying v${VERSION} via hot upgrade..."
              scp -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
                /tmp/release/dodo_router-${VERSION}.tar.gz \
                ${{ secrets.APP_DEPLOY_USER }}@${{ secrets.APP_DEPLOY_HOST }}:/tmp/dodo_router-${VERSION}.tar.gz

              # Run the NEW release's migrations BEFORE installing it. Migrations
              # are .exs sources compiled at runtime and Ecto.Migrator.run/4
              # takes an explicit path — so extract just the migration files
              # from the tarball (a few KB, no full unpack) and run them through
              # the currently installed release. The old code keeps serving and
              # a failure aborts the deploy with the running version untouched.
              echo "Running v${VERSION} migrations before upgrade..."
              MIGRATIONS_DIR="/tmp/dodo_migrations/dodo_router/lib/dodo_router-${VERSION}/priv/repo/migrations"
              ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
                ${{ secrets.APP_DEPLOY_USER }}@${{ secrets.APP_DEPLOY_HOST }} \
                "rm -rf /tmp/dodo_migrations && mkdir -p /tmp/dodo_migrations && tar xzf /tmp/dodo_router-${VERSION}.tar.gz -C /tmp/dodo_migrations dodo_router/lib/dodo_router-${VERSION}/priv/repo/migrations && ~/dodorouter/current/dodo_router/bin/dodo_router eval 'Ecto.Migrator.with_repo(DodoRouter.Repo, fn repo -> Ecto.Migrator.run(repo, ~s(${MIGRATIONS_DIR}), :up, all: true) end)' && rm -rf /tmp/dodo_migrations" || {
                echo "ERROR: Database migration failed — aborting before upgrade (old version untouched)"
                exit 1
              }

              # Run upgrade but don't fail immediately - the RPC process gets killed after make_permanent
              ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
                ${{ secrets.APP_DEPLOY_USER }}@${{ secrets.APP_DEPLOY_HOST }} \
                "cp /tmp/dodo_router-${VERSION}.tar.gz ~/dodorouter/current/dodo_router/releases/${VERSION}.tar.gz && ~/dodorouter/current/dodo_router/bin/upgrade ${VERSION}" || true

              # Give the upgraded node a moment to settle before verification
              sleep 3
              
              # Sync static assets to Caddy
              echo "Syncing static assets to Caddy..."
              ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
                ${{ secrets.APP_DEPLOY_USER }}@${{ secrets.APP_DEPLOY_HOST }} \
                "rsync -a ~/dodorouter/current/dodo_router/lib/dodo_router-${VERSION}/priv/static/ ~/lobsterfarm-backend/web_files/dodorouter-static/"

              # Phoenix memoizes each resolved static path in the endpoint's
              # config cache (Phoenix.Config.cache is get-or-compute), so the
              # digests memoized at cold boot survive hot upgrades AND a plain
              # endpoint warmup — pages keep linking the boot-era assets.
              # Clear the memos first, then re-warm from this release's
              # cache_manifest.json.
              echo "Refreshing static asset cache on the running node..."
              ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
                ${{ secrets.APP_DEPLOY_USER }}@${{ secrets.APP_DEPLOY_HOST }} \
                "~/dodorouter/current/dodo_router/bin/dodo_router rpc 'Phoenix.Config.clear_cache(DodoRouterWeb.Endpoint); Phoenix.Endpoint.Supervisor.warmup(DodoRouterWeb.Endpoint)'" || {
                echo "WARNING: static cache refresh failed — assets may reference the previous version until a full restart"
              }

              # Verify upgrade succeeded by checking version
              CURRENT_VERSION=$(ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
                ${{ secrets.APP_DEPLOY_USER }}@${{ secrets.APP_DEPLOY_HOST }} \
                "~/dodorouter/current/dodo_router/bin/dodo_router version 2>/dev/null | awk '{print \$2}'" || echo "unknown")
              
              if [ "$CURRENT_VERSION" = "$VERSION" ]; then
                echo "v${VERSION} deployed successfully (verified)"
              else
                echo "ERROR: Version verification failed. Expected ${VERSION}, got ${CURRENT_VERSION}"
                exit 1
              fi
            done
          fi

      - name: Health check
        run: |
          echo "Waiting for health check..."
          for i in {1..30}; do
            if curl -sf "http://${{ secrets.APP_DEPLOY_HOST }}:4000/health" > /dev/null 2>&1; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          echo "ERROR: Health check failed"
          exit 1
