name: Build & Release

permissions:
  contents: write
  actions: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # OTP/Elixir MUST be pinned to exact versions. Hot upgrades can only be
      # installed when the new release's ERTS matches the running node's; a
      # floating version ("27") resolves to the latest patch at build time,
      # so an upstream OTP patch release silently makes the next hot upgrade
      # impossible (relup gets restart_new_emulator, which we don't support).
      # If you bump these, the first deploy afterwards must be a full install
      # (Deploy workflow with full_install=true).
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          # ERTS 15.2.7.10 — matches the v0.1.82 build (see that run's
          # "Set up Elixir" step). The running node must be on this ERTS
          # for hot upgrades to install.
          otp-version: "27.3.4.14"

      - name: Bump version
        run: |
          .github/scripts/bump-version.sh

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -E '^\s+version:\s+"[0-9]+\.[0-9]+\.[0-9]+",' mix.exs | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get --only prod

      - name: Compile
        run: MIX_ENV=prod mix compile

      - name: Build assets
        run: MIX_ENV=prod mix assets.deploy

      - name: Build release
        run: MIX_ENV=prod mix release

      - name: Download previous release
        id: previous
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "v${{ steps.version.outputs.version }}" | head -1)
          if [ -n "$PREV_TAG" ]; then
            PREV_VERSION=${PREV_TAG#v}
            echo "prev_version=$PREV_VERSION" >> $GITHUB_OUTPUT
            echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
            echo "Previous version: $PREV_VERSION"

            mkdir -p /tmp/prev-release

            # gh needs --repo or it fails when cwd is not a git repo
            gh release download "$PREV_TAG" \
              --repo "${{ github.repository }}" \
              --pattern "dodo_router-${PREV_VERSION}.tar.gz" \
              --dir /tmp/prev-release 2>&1 || echo "gh download failed"

            # Extract previous release for relup generation
            if [ -f "/tmp/prev-release/dodo_router-${PREV_VERSION}.tar.gz" ]; then
              mkdir -p /tmp/prev-release/extracted
              tar xzf "/tmp/prev-release/dodo_router-${PREV_VERSION}.tar.gz" -C /tmp/prev-release/extracted
              echo "prev_extracted=true" >> $GITHUB_OUTPUT
              echo "Extracted previous release"
            else
              echo "prev_extracted=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "No previous version found"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate .relup
        if: steps.previous.outputs.prev_extracted == 'true'
        run: |
          PREV_VERSION="${{ steps.previous.outputs.prev_version }}"
          CURR_VERSION="${{ steps.version.outputs.version }}"

          PREV_REL_FILE="dodo_router-${PREV_VERSION}.rel"
          PREV_REL_DIR="/tmp/prev-release/extracted/dodo_router/releases"

          if [ -f "${PREV_REL_DIR}/${PREV_VERSION}/dodo_router.rel" ]; then
            FROMTO="${PREV_REL_DIR}/${PREV_VERSION}/dodo_router"
          else
            echo "ERROR: Previous release .rel file not found"
            echo "Searched in:"
            ls -la "${PREV_REL_DIR}/" 2>/dev/null || true
            ls -la "${PREV_REL_DIR}/${PREV_VERSION}/" 2>/dev/null || true
            exit 1
          fi

          echo "From: $FROMTO"

          MIX_ENV=prod mix forecastle.relup \
            --target "_build/prod/rel/dodo_router/releases/${CURR_VERSION}/dodo_router" \
            --fromto "$FROMTO"
          
          # A missing relup means systools:make_relup failed — its error is in
          # the output above (mix forecastle.relup ignores the return value).
          # Publishing the tarball anyway ships a release whose hot upgrade is
          # guaranteed to fail on the server, which is how v0.1.129 deployed
          # into {:no_matching_relup, ...} (dodo_router-5kk). Fail here, where
          # the systools error is visible. A deliberate OTP/ERTS bump doesn't
          # trip this: make_relup still succeeds (with restart_new_emulator),
          # and per the pin comment above the first deploy after it runs with
          # full_install=true.
          if [ -f "relup" ]; then
            cp relup "_build/prod/rel/dodo_router/releases/${CURR_VERSION}/relup"
            echo "Generated relup file"
          else
            echo "ERROR: relup file not generated — see systools output above"
            exit 1
          fi

      - name: Rebuild tarball with relup
        if: steps.previous.outputs.prev_version != ''
        run: |
          CURR_VERSION="${{ steps.version.outputs.version }}"
          # Recreate tarball with relup included
          cd _build/prod/rel
          tar czf "dodo_router-${CURR_VERSION}.tar.gz" dodo_router
          mv "dodo_router-${CURR_VERSION}.tar.gz" ../

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          files: |
            _build/prod/dodo_router-${{ steps.version.outputs.version }}.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: false
