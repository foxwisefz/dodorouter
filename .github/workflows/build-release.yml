name: Build & Release

permissions:
  contents: write
  actions: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Bump version
        run: |
          .github/scripts/bump-version.sh

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -E '^\s+version:\s+"[0-9]+\.[0-9]+\.[0-9]+",' mix.exs | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get --only prod

      - name: Compile
        run: MIX_ENV=prod mix compile

      - name: Build assets
        run: MIX_ENV=prod mix assets.deploy

      - name: Build release
        run: MIX_ENV=prod mix release

      - name: Download previous release
        id: previous
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "v${{ steps.version.outputs.version }}" | head -1)
          if [ -n "$PREV_TAG" ]; then
            PREV_VERSION=${PREV_TAG#v}
            echo "prev_version=$PREV_VERSION" >> $GITHUB_OUTPUT
            echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
            echo "Previous version: $PREV_VERSION"

            mkdir -p /tmp/prev-release

            # gh needs --repo or it fails when cwd is not a git repo
            gh release download "$PREV_TAG" \
              --repo "${{ github.repository }}" \
              --pattern "dodo_router-${PREV_VERSION}.tar.gz" \
              --dir /tmp/prev-release 2>&1 || echo "gh download failed"

            # Extract previous release for relup generation
            if [ -f "/tmp/prev-release/dodo_router-${PREV_VERSION}.tar.gz" ]; then
              mkdir -p /tmp/prev-release/extracted
              tar xzf "/tmp/prev-release/dodo_router-${PREV_VERSION}.tar.gz" -C /tmp/prev-release/extracted
              
              # Handle both flat and prefixed tarball formats
              if [ -d "/tmp/prev-release/extracted/dodo_router" ]; then
                # Old format with dodo_router/ prefix
                mv /tmp/prev-release/extracted/dodo_router /tmp/prev-release/extracted/dodo_router_moved
                mv /tmp/prev-release/extracted/dodo_router_moved/* /tmp/prev-release/extracted/
                rmdir /tmp/prev-release/extracted/dodo_router_moved 2>/dev/null || true
              fi
              
              echo "prev_extracted=true" >> $GITHUB_OUTPUT
              echo "Extracted previous release"
            else
              echo "prev_extracted=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "No previous version found"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate .relup
        if: steps.previous.outputs.prev_extracted == 'true'
        run: |
          PREV_VERSION="${{ steps.previous.outputs.prev_version }}"
          CURR_VERSION="${{ steps.version.outputs.version }}"

          PREV_REL_FILE="dodo_router-${PREV_VERSION}.rel"
          PREV_REL_DIR="/tmp/prev-release/extracted/releases"

          # The .rel file could be at releases/<vsn>/dodo_router or releases/<vsn>/{vsn}
          if [ -f "${PREV_REL_DIR}/${PREV_VERSION}/dodo_router.rel" ]; then
            FROMTO="${PREV_REL_DIR}/${PREV_VERSION}/dodo_router"
          elif [ -f "${PREV_REL_DIR}/${PREV_VERSION}/${PREV_VERSION}.rel" ]; then
            FROMTO="${PREV_REL_DIR}/${PREV_VERSION}/${PREV_VERSION}"
          elif [ -f "${PREV_REL_DIR}/${PREV_REL_FILE}" ]; then
            # For flat rel files, strip .rel extension
            FROMTO="${PREV_REL_DIR}/${PREV_REL_FILE%.rel}"
          else
            echo "ERROR: Previous release .rel file not found"
            echo "Searched in:"
            ls -la "${PREV_REL_DIR}/${PREV_VERSION}/" 2>/dev/null || true
            exit 1
          fi

          echo "From: $FROMTO"

          MIX_ENV=prod mix forecastle.relup \
            --target "_build/prod/rel/dodo_router/releases/${CURR_VERSION}/dodo_router" \
            --fromto "$FROMTO"
          
          # Verify relup was generated
          if [ -f "relup" ]; then
            cp relup "_build/prod/rel/dodo_router/releases/${CURR_VERSION}/relup"
            echo "Generated relup file"
          else
            echo "WARNING: relup file not generated"
          fi

      - name: Rebuild tarball with relup
        run: |
          CURR_VERSION="${{ steps.version.outputs.version }}"
          
          # Release handler expects .rel file named as {vsn}.rel, not dodo_router.rel
          # Rename it so hot upgrades work without extraction/repacking
          cd _build/prod/rel/dodo_router
          if [ -f "releases/${CURR_VERSION}/dodo_router.rel" ]; then
            cp "releases/${CURR_VERSION}/dodo_router.rel" "releases/${CURR_VERSION}/${CURR_VERSION}.rel"
          fi
          if [ -f "releases/dodo_router-${CURR_VERSION}.rel" ]; then
            mv "releases/dodo_router-${CURR_VERSION}.rel" "releases/${CURR_VERSION}.rel" 2>/dev/null || true
          fi
          
          # Create flat upgrade tarball (no dodo_router/ prefix)
          # This is what release_handler.unpack_release expects
          tar czf "../dodo_router-${CURR_VERSION}.tar.gz" *
          
          cd ..
          echo "Created flat tarball: dodo_router-${CURR_VERSION}.tar.gz"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: dodo-router-release-${{ steps.version.outputs.version }}
          path: _build/prod/dodo_router-${{ steps.version.outputs.version }}.tar.gz
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          files: |
            _build/prod/dodo_router-${{ steps.version.outputs.version }}.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: false
