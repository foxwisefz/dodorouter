name: Build & Release

permissions:
  contents: write
  actions: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Bump version
        run: |
          .github/scripts/bump-version.sh

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -E '^\s+version:\s+"[0-9]+\.[0-9]+\.[0-9]+",' mix.exs | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "28"

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get --only prod

      - name: Compile
        run: MIX_ENV=prod mix compile

      - name: Build assets
        run: MIX_ENV=prod mix assets.deploy

      - name: Build release
        run: MIX_ENV=prod mix release

      - name: Upload full release artifact
        uses: actions/upload-artifact@v4
        with:
          name: dodo-router-release-${{ steps.version.outputs.version }}
          path: _build/prod/rel/dodo_router/dodo_router-${{ steps.version.outputs.version }}.tar.gz
          retention-days: 90

      - name: Download previous release
        id: previous
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "v${{ steps.version.outputs.version }}" | head -1)
          if [ -n "$PREV_TAG" ]; then
            PREV_VERSION=${PREV_TAG#v}
            echo "prev_version=$PREV_VERSION" >> $GITHUB_OUTPUT
            echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
            echo "Previous version: $PREV_VERSION"
            
            # Try to download from existing release
            mkdir -p /tmp/prev-release
            cd /tmp/prev-release
            gh release download "$PREV_TAG" --pattern "dodo-router-${PREV_VERSION}.tar.gz" || true
            cd -
          else
            echo "No previous version found"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build upgrade tarball
        if: steps.previous.outputs.prev_version != ''
        run: |
          mkdir -p _build/prod/rel/dodo_router_prev
          cd _build/prod/rel/dodo_router_prev
          if [ -f "/tmp/prev-release/dodo-router-${{ steps.previous.outputs.prev_version }}.tar.gz" ]; then
            tar xzf "/tmp/prev-release/dodo-router-${{ steps.previous.outputs.prev_version }}.tar.gz"
            cd -
            MIX_ENV=prod mix release --upgrade --path _build/prod/rel/dodo_router_prev
            echo "Upgrade tarball built successfully"
          else
            echo "Previous release tarball not found, skipping upgrade build"
            cd -
          fi

      - name: Upload upgrade artifact
        if: steps.previous.outputs.prev_version != ''
        uses: actions/upload-artifact@v4
        with:
          name: dodo-router-upgrade-${{ steps.previous.outputs.prev_version }}-to-${{ steps.version.outputs.version }}
          path: _build/prod/rel/dodo_router/dodo_router-${{ steps.version.outputs.version }}.tar.gz
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          files: |
            _build/prod/rel/dodo_router/dodo_router-${{ steps.version.outputs.version }}.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: false
